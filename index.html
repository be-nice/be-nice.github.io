<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Will the Fool make a website?</title>
  </head>
  <body>
    <section id="full_site">
      <div id="streaming" class="split">
        <h1>Streaming</h1>

        <!-- Add a placeholder for the Twitch embed -->
        <div id="twitch_embed_wrapper">
          <div id="twitch-embed"></div>
        </div>

        <div id="stream_button_wrapper">
          <a id="btn_schedule" class="button">Schedule</a>
          <a href="" class="button">Game list</a>
          <a href="" class="button">Commands & stats</a>
          <a href="" class="button">Finnegan</a>
        </div>

        <!-- Load the Twitch embed JavaScript file -->
        <script src="https://embed.twitch.tv/embed/v1.js"></script>
      </div>

      <section id="schedule-grid" class="hidden split">
        <div class="schedule-row">
          <div class="weekday">Monday</div>
          <div class="scheduled">No stream today!</div>
        </div>
        <div class="schedule-row">
          <div class="weekday">Tuesday</div>
          <div class="scheduled">Coding</div>
          <div class="scheduled">Gaming</div>
        </div>
        <div class="schedule-row">
          <div class="weekday">Wednesday</div>
          <div class="scheduled">Coding</div>
          <div class="scheduled">Gaming</div>
        </div>
        <div class="schedule-row">
          <div class="weekday">Thursday</div>
          <div class="scheduled">Coding</div>
          <div class="scheduled">Gaming</div>
        </div>
        <div class="schedule-row">
          <div class="weekday">Friday</div>
          <div class="scheduled">Coding</div>
          <div class="scheduled">Gaming</div>
          <div class="scheduled">Gaming</div>
        </div>
        <div class="schedule-row">
          <div class="weekday">Saturday</div>
          <div class="scheduled">Gaming</div>
          <div class="scheduled">Gaming</div>
        </div>
        <div class="schedule-row">
          <div class="weekday">Sunday</div>
          <div class="scheduled">Gaming</div>
          <div class="scheduled">Gaming</div>
        </div>
      </section>
      <div id="portfolio" class="split">
        <h1>Portfolio</h1>
        <p>Test test test</p>
      </div>
    </section>

    <script src="scripts.js"></script>
  </body>
</html>
